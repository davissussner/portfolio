<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Davis Sussner | Advertising &amp; PR Portfolio</title>
  <meta name="description" content="Creative portfolio of Davis Sussner, Advertising & Public Relations at the University of Nebraska–Lincoln: campaigns, design, photography and video.">
  <meta property="og:title" content="Davis Sussner | Creative Portfolio">
  <meta property="og:description" content="Campaigns, design, photography and video. Advertising & PR at the University of Nebraska–Lincoln.">
  <meta property="og:image" content="assets/img/nsac/billboard-play-anyway.jpg">
  <meta property="og:type" content="website">

  <!-- THEME: change "minimal" to "editorial" or "husker" to switch the whole look. -->
  <link id="theme" rel="stylesheet" href="css/themes/minimal.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="#top" data-name>Davis Sussner</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav class="nav" id="nav">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#resume-section">Resume</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow" id="hero-school"></p>
        <h1><span data-name>Davis Sussner</span></h1>
        <p class="lede" id="hero-tagline"></p>
        <div class="actions">
          <a class="btn" href="#work">See the work</a>
          <a class="btn ghost" href="#contact">Get in touch</a>
        </div>
      </div>
    </section>

    <section id="work">
      <div class="wrap">
        <div class="section-head">
          <h2>Selected work</h2>
          <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        </div>
        <div class="grid" id="work-grid"></div>
      </div>
    </section>

    <section id="about">
      <div class="wrap about">
        <img id="headshot" src="" alt="">
        <div>
          <p class="eyebrow">About</p>
          <div class="bio" id="bio"></div>
          <dl class="facts" id="facts"></dl>
        </div>
      </div>
    </section>

    <section id="resume-section">
      <div class="wrap">
        <div class="section-head">
          <h2>Resume</h2>
          <div id="resume-pdf"></div>
        </div>
        <div class="resume" id="resume"></div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="wrap">
        <p class="eyebrow">Contact</p>
        <h2>Let's make something worth noticing.</h2>
        <a class="email" id="email" href="#"></a>
        <div class="socials" id="socials"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© <span id="year"></span> <span data-name>Davis Sussner</span></div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
